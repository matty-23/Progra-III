<html>
    <head>
        <title>Register</title>
        <link rel="stylesheet" href="CSS/registro.css">
    </head>
    <body>
        <h1>Registrarse</h1 class="h1Register">
        <form>
            <label>Nombre:</label class="lblRegister">
            <input type="text" id="name" required><br>
            <label>Apellido:</label class="lblRegister">
            <input type="text" id="lastname"  required><br>
            <label>Email:</label class="lblRegister">
            <input type="email" id="email" required><br>
            <label>Fecha de nacimiento:</label class="lblRegister" >
            <input type="date" id="birthdate" required><br>
            <label>Contraseña:</label class="lblRegister">
            <input type="password" id="password"required><br>
            <label>Confirmar contraseña:</label class="lblRegister">
            <input type="password" id="confirm_password" required><br>
            <input type="submit" class="btnRegistrar">
        </form>
    </body>
</html>
